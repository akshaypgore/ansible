- name: Update cache
  ansible.builtin.apt:
    update_cache: true

- name: Install haproxy
  ansible.builtin.apt:
    pkg:
      - "haproxy={{ haproxy_version }}"
  notify: Reload systemd and restart haproxy service

- name: Install keppalived
  ansible.builtin.apt:
    pkg:
      - "psmisc={{ psmisc_version }}"
      - "keepalived={{ keepalived_version }}"
  notify: Reload systemd and restart keepalived service

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Enable IPv4 nonlocal binding
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true

- name: Deploy complete haproxy configuration file
  ansible.builtin.template:
    src: haproxy.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart haproxy service

- name: Deploy complete keepalived configuration file
  ansible.builtin.template:
    src: keepalived.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart keepalived service

- name: Deploy haproxy status check configuration file for keeaplived
  ansible.builtin.template:
    src: files/check_haproxy.sh
    dest: /etc/keepalived/check_haproxy.sh
    owner: root
    group: root
    mode: "0755"
