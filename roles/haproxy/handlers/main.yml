- name: Reload systemd and restart haproxy service
  ansible.builtin.systemd_service:
    name: "{{ lb_service_name }}"
    state: restarted
    daemon_reload: true
    enabled: true

- name: Reload systemd and restart keepalived service
  ansible.builtin.systemd_service:
    name: "{{ keepalived_service_name }}"
    state: restarted
    daemon_reload: true
    enabled: true
