- name: Update cache
  ansible.builtin.apt:
    update_cache: true

- name: Install etcd-server
  ansible.builtin.apt:
    pkg:
      - "etcd-server={{ etcd_server_version }}"
  notify: Reload systemd and restart etcd service

- name: Install etcd-client
  ansible.builtin.apt:
    pkg:
      - "etcd-client={{ etcd_client_version }}"

- name: Create required data and wal directories for etcd
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0755"
    recurse: true
  loop:
    - /data
    - /wal

- name: Set permissions for a ssl directory
  ansible.builtin.file:
    path: /etc/ssl/private
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy CA Certificate
  ansible.builtin.copy:
    src: files/certs/ca.crt
    dest: /etc/ssl/certs/ca.crt
    owner: etcd
    group: etcd
    mode: "0644"
  notify: Reload systemd and restart etcd service

- name: Copy Node Server Certificate
  ansible.builtin.copy:
    src: "files/certs/{{ inventory_hostname }}.crt"
    dest: "/etc/ssl/certs/{{ inventory_hostname }}.crt"
    owner: etcd
    group: etcd
    mode: "0644"
  notify: Reload systemd and restart etcd service

- name: Copy Node Server Private Key
  ansible.builtin.copy:
    src: "files/certs/{{ inventory_hostname }}-private.key"
    dest: "/etc/ssl/private/{{ inventory_hostname }}-private.key"
    owner: etcd
    group: etcd
    mode: "0600"
  notify: Reload systemd and restart etcd service

- name: Deploy complete etcd environment configuration file
  ansible.builtin.template:
    src: etcd.j2
    dest: /etc/default/etcd
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart etcd service

- name: Create systemd drop-in directory for etcd
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create drop-in configuration file for etcd
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ service_name }}.service.d/10-custom-overrides.conf"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/etcd --config-file=/etc/default/etcd
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart etcd service
